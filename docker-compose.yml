# Lancer avec les variables de backend/.env (copier backend/.env.example) :
#   docker compose --env-file backend/.env up -d postgres
#   docker compose --env-file backend/.env --profile tools up -d pgadmin
services:
  postgres:
    image: postgres:16-alpine
    container_name: pif-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pif_trading_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      # Aucun mot de passe par défaut : DB_PASSWORD doit être défini dans backend/.env
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant - copier backend/.env.example vers backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-pif_trading_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Interface graphique d'administration pgAdmin (optionnel : --profile tools)
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pif-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    name: pif_postgres_data
