services:
  postgres:
    image: postgres:16-alpine
    container_name: pif-postgres
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-pif_trading_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Adem2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d market_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Interface graphique d'administration pgAdmin (optionnel : docker compose --profile tools up -d)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pif-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin@26
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    name: pif_postgres_data
