services:
  postgres:
    image: postgres:16-alpine
    container_name: pif-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: market_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-votre_mot_de_passe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d market_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: pif_postgres_data
