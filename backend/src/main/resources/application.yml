server:
  port: 8080

spring:
  application:
    name: market-simulator-backend

  # Base de données PostgreSQL alimentée par les variables d'environnement .env
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:votre_mot_de_passe}
    driver-class-name: org.postgresql.Driver

  # Hibernate & Spring Data JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cache Caffeine pour optimiser les quotas API externes
  cache:
    type: caffeine
    cache-names:
      - alphaVantageHistory
      - alphaVantageQuotes

# Configuration dédiée à l'API Alpha Vantage
alpha:
  vantage:
    api-key: ${ALPHA_VANTAGE_API_KEY:votre_cle_alpha_vantage}
    base-url: https://www.alphavantage.co/query
    cache-ttl-minutes: 15
    connect-timeout-seconds: 10
    read-timeout-seconds: 15

# Configuration du Microservice IA (FastAPI / XGBoost / RAG / FinGPT)
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    predict-timeout-seconds: 10
    analyze-timeout-seconds: 120
    cache-ttl-minutes: 30

# Sécurité, JWT & Initialisation Admin
application:
  security:
    jwt:
      secret: ${JWT_SECRET:une_cle_secrete_tres_longue_et_securisee_d_au_moins_256_bits_ici}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    admin:
      email: ${DEFAULT_ADMIN_EMAIL:admin@gmail.com}
      password: ${DEFAULT_ADMIN_PASSWORD:admin@26}

logging:
  level:
    com.pif: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
