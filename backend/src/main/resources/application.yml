server:
  port: 8080

spring:
  application:
    name: market-simulator-backend

  # Base de données PostgreSQL alimentée par les variables d'environnement .env
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/pif_trading_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    # Aucun mot de passe par défaut : à définir dans backend/.env (voir backend/.env.example)
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  # Hibernate & Spring Data JPA
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  # Cache Caffeine pour optimiser les quotas API externes
  cache:
    type: caffeine
    cache-names:
      - alphaVantageHistory
      - alphaVantageQuotes

# Configuration dédiée à l'API Alpha Vantage
alpha:
  vantage:
    api-key: ${ALPHA_VANTAGE_API_KEY:votre_cle_alpha_vantage}
    base-url: https://www.alphavantage.co/query
    cache-ttl-minutes: 15
    connect-timeout-seconds: 10
    read-timeout-seconds: 15

# Configuration du Microservice IA (FastAPI / XGBoost / RAG / FinGPT)
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    predict-timeout-seconds: 10
    analyze-timeout-seconds: 120
    cache-ttl-minutes: 30

# Sécurité, JWT & Initialisation Admin
# Aucun secret par défaut : l'application refuse de démarrer si JWT_SECRET est absent,
# et le compte admin n'est créé que si DEFAULT_ADMIN_EMAIL et DEFAULT_ADMIN_PASSWORD sont définis.
application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    admin:
      email: ${DEFAULT_ADMIN_EMAIL:}
      password: ${DEFAULT_ADMIN_PASSWORD:}

logging:
  level:
    com.pif: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
