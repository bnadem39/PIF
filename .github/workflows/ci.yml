name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Les tests utilisent H2 + src/test/resources/application.yml : aucun secret requis
      - run: ./mvnw -B test

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ai:
    name: AI service (syntax check + stress tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # Vérification légère : les dépendances complètes (torch, chromadb...) sont trop lourdes pour la CI
      - run: python -m py_compile ai/*.py
      # Le module de stress testing n'a besoin que d'un sous-ensemble léger des dépendances
      - run: pip install numpy pandas scikit-learn xgboost-cpu shap joblib fastapi httpx pytest
      - run: python -m pytest stress/tests -q
        working-directory: ai
